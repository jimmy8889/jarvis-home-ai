title: Energy Optimizer
views:
  - title: Energy
    path: overview
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:lightning-bolt-circle
          - type: markdown
            content: |
              {% set plan_entity = states.sensor.energy_optimizer_plan %}
              {% set p = plan_entity.attributes if plan_entity is not none else {} %}
              {% set actuator = states('input_text.energy_optimizer_actuator_status') %}
              {% set actuator_fields = actuator.split(' | ') %}
              {% set expected_mode = p.get('battery_mode', '') %}
              {% set confirmation_pending = actuator_fields | count >= 3
                 and actuator_fields[0] in ['requested', 'applied', 'confirmed_direction']
                 and actuator_fields[1] == states('sensor.energy_optimizer_plan')
                 and ('mode=' ~ expected_mode) in actuator_fields %}
              ## {{ states('sensor.energy_optimizer_status') | replace('_', ' ') | title }} · {{ p.get('action', 'unknown') | replace('_', ' ') | title }}
              **{{ p.get('reason', 'Waiting for a current plan') }}**

              {% if is_state('binary_sensor.energy_optimizer_actuation_ready', 'on') %}
              ✅ Controls and live telemetry agree.
              {% elif confirmation_pending %}
              🟡 Applying and confirming the current battery command.
              {% else %}
              ⚠️ {{ states('sensor.energy_optimizer_readiness') | replace('_', ' ') | title }}
              {% endif %}
            grid_options:
              columns: 12
              rows: 3
          - type: gauge
            entity: sensor.saj_battery_1_soc
            name: Home battery
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 10
              red: 0
            grid_options:
              columns: 6
              rows: 3
          - type: tile
            entity: sensor.energy_optimizer_battery_power_target
            name: Battery plan
            icon: mdi:battery-sync
            vertical: true
            grid_options:
              columns: 6
              rows: 3
          - type: tile
            entity: sensor.saj_pv_power
            name: Solar
            icon: mdi:solar-power
          - type: tile
            entity: sensor.saj_home_load
            name: House
            icon: mdi:home-lightning-bolt
          - type: tile
            entity: sensor.saj_battery_power
            name: Battery power
            icon: mdi:battery-charging
          - type: tile
            entity: sensor.saj_meter_a_real_power_total
            name: Grid
            icon: mdi:transmission-tower

      - type: grid
        cards:
          - type: heading
            heading: Prices and selling
            icon: mdi:cash-fast
          - type: tile
            entity: sensor.amber_express_trader_sheena_street_feed_in_price
            name: Sell price now
            icon: mdi:transmission-tower-export
            vertical: true
          - type: tile
            entity: sensor.amber_express_trader_sheena_street_general_price
            name: Buy price now
            icon: mdi:transmission-tower-import
            vertical: true
          - type: tile
            entity: input_number.energy_optimizer_min_sell_price_c_per_kwh
            name: Minimum battery sell price
            icon: mdi:cash-lock
            features_position: bottom
            vertical: false
          - type: tile
            entity: sensor.energy_optimizer_site_export_target
            name: Export target
            icon: mdi:transmission-tower-export
          - type: tile
            entity: sensor.energy_optimizer_pv_export
            name: Solar export
            icon: mdi:solar-power-variant
          - type: tile
            entity: binary_sensor.energy_optimizer_negative_fit_export_violation
            name: Zero-export check
            icon: mdi:transmission-tower-off
          - type: markdown
            content: |
              {% set plan_entity = states.sensor.energy_optimizer_plan %}
              {% set p = plan_entity.attributes if plan_entity is not none else {} %}
              {% set ns = namespace(intervals=[], shown=0) %}
              {% for entity_id in p.get('horizon_entity_ids', []) %}
                {% if state_attr(entity_id, 'plan_id') == p.get('horizon_plan_id') %}
                  {% set ns.intervals = ns.intervals + (state_attr(entity_id, 'intervals') | default([], true)) %}
                {% endif %}
              {% endfor %}
              ### Rolling 36-hour export plan
              **{{ p.get('total_export_energy_kwh', '—') }} kWh export** ·
              {{ p.get('solar_export_energy_kwh', '—') }} solar ·
              {{ p.get('battery_export_energy_kwh', '—') }} battery<br>
              Expected revenue **${{ p.get('expected_revenue') | round(2) if p.get('expected_revenue') is number else '—' }}**

              {% for item in ns.intervals %}
                {% if item.get('site_grid_kw', 0) < -0.2 and ns.shown < 6 %}
                  {% set ns.shown = ns.shown + 1 %}
              {{ as_timestamp(item.get('start')) | timestamp_custom('%a %-I:%M %p') }} · **{{ (0 - item.get('site_grid_kw')) | round(1) }} kW** · FIT {{ (item.get('export_price') * 100) | round(1) }}c
                {% endif %}
              {% endfor %}
              {% if ns.shown == 0 %}No export interval is currently forecast.{% endif %}
            grid_options:
              columns: 12
              rows: 6

      - type: grid
        cards:
          - type: heading
            heading: Flexible loads
            icon: mdi:calendar-clock
          - type: markdown
            content: |
              {% set hw_entity = states.sensor.energy_optimizer_hot_water %}
              {% set hw = hw_entity.attributes if hw_entity is not none else {} %}
              {% set ev_entity = states.sensor.energy_optimizer_ev %}
              {% set ev = ev_entity.attributes if ev_entity is not none else {} %}
              {% set plan_entity = states.sensor.energy_optimizer_plan %}
              {% set p = plan_entity.attributes if plan_entity is not none else {} %}
              {% macro local_time(value) -%}
                {%- if value not in [none, '', 'unknown', 'unavailable'] -%}
                  {{ as_timestamp(value) | timestamp_custom('%a %-I:%M %p') }}
                {%- else -%}not scheduled{%- endif -%}
              {%- endmacro %}
              {% macro kwh(value) -%}
                {{ value | round(2) if value is number else '—' }}
              {%- endmacro %}
              ### Hot water
              **{{ states('sensor.energy_optimizer_hot_water') | replace('_', ' ') | title }}** ·
              {{ (states('sensor.hot_water_confirmed_runtime_today') | float(none) | round(2)) if has_value('sensor.hot_water_confirmed_runtime_today') else 'unavailable' }} / 3 confirmed hours<br>
              Service **{{ states('binary_sensor.energy_optimizer_hot_water_service_complete') | title }}** ·
              {{ state_attr('binary_sensor.energy_optimizer_hot_water_service_complete', 'completion_basis') | default('incomplete', true) | replace('_', ' ') }}<br>
              {% if is_state('switch.hot_water', 'on') %}
              Running now · planned finish **{{ local_time(hw.get('expected_end')) }}**<br>
              {% else %}
              Planned window **{{ local_time(hw.get('expected_start')) }} – {{ local_time(hw.get('expected_end')) }}**<br>
              {% endif %}
              Solar **{{ kwh(hw.get('solar_energy_kwh')) }} kWh** · Battery **{{ kwh(hw.get('battery_energy_kwh')) }} kWh** · Grid **{{ kwh(hw.get('grid_energy_kwh')) }} kWh**

              ### Car
              **{{ states('sensor.energy_optimizer_ev') | replace('_', ' ') | title }}** ·
              {{ states('sensor.tesla_battery_level') }}% now · target {{ ev.get('target_soc_pct', '—') }}%<br>
              {% if is_state('switch.tesla_ble_039d9c_charger', 'on') %}
              Charging now · {{ states('number.tesla_ble_039d9c_charging_amps') | int if has_value('number.tesla_ble_039d9c_charging_amps') else 'unavailable' }} A · source **{{ ev.get('charge_source', 'expected solar') | replace('_', ' ') }}**<br>
              {% else %}
              Planned window **{{ local_time(ev.get('charge_start')) }} – {{ local_time(ev.get('charge_end')) }}**<br>
              {% endif %}
              Scheduled **{{ ev.get('schedule_amps', '—') }} A** · live target **{{ ev.get('live_target_amps', '—') }} A** · reserve **{{ ev.get('house_reserve_soc_pct', '—') }}%**<br>
              Solar **{{ kwh(ev.get('solar_energy_kwh')) }} kWh** · Battery **{{ kwh(ev.get('battery_energy_kwh')) }} kWh** · Grid **{{ kwh(ev.get('grid_energy_kwh')) }} kWh**

              ### Normal house · next 36 hours
              **{{ kwh(p.get('house_total_energy_kwh')) }} kWh expected**<br>
              Solar **{{ kwh(p.get('house_solar_energy_kwh')) }} kWh** · Battery **{{ kwh(p.get('house_battery_energy_kwh')) }} kWh** · Grid **{{ kwh(p.get('house_grid_energy_kwh')) }} kWh**
            grid_options:
              columns: 12
              rows: 9
          - type: tile
            entity: switch.hot_water
            name: Hot water relay
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.energy_optimizer_hot_water_outcome
            name: Hot water status
            icon: mdi:water-check
          - type: tile
            entity: switch.tesla_ble_039d9c_charger
            name: Car charger
            icon: mdi:ev-station
          - type: tile
            entity: sensor.energy_optimizer_ev_outcome
            name: Car status
            icon: mdi:car-clock
          - type: entities
            title: Car requirement
            show_header_toggle: false
            entities:
              - entity: input_select.energy_optimizer_ev_trip
                name: Next trip
              - entity: input_number.energy_optimizer_ev_custom_km
                name: Custom distance
              - entity: input_datetime.energy_optimizer_ev_departure
                name: Departure
              - entity: number.tesla_ble_039d9c_charging_limit
                name: Car charge limit
              - entity: input_boolean.energy_optimizer_ev_allow_grid
                name: Charge from grid
              - entity: input_boolean.energy_optimizer_ev_allow_fleet_fallback
                name: Allow paid Fleet fallback
            grid_options:
              columns: 12
              rows: 5

      - type: grid
        cards:
          - type: heading
            heading: Rolling solar forecast
            icon: mdi:weather-sunny-clock
          - type: markdown
            content: |
              {% set plan_entity = states.sensor.energy_optimizer_plan %}
              {% set p = plan_entity.attributes if plan_entity is not none else {} %}
              {% macro local_time(value) -%}
                {%- if value not in [none, '', 'unknown', 'unavailable'] -%}
                  {{ as_timestamp(value) | timestamp_custom('%a %-I:%M %p') }}
                {%- else -%}unavailable{%- endif -%}
              {%- endmacro %}
              | Event | Forecast |
              |:--|--:|
              | Solar takes over | **{{ local_time(p.get('morning_takeover')) }}** |
              | Solar falls below the house | **{{ local_time(p.get('evening_crossover')) }}** |
              | Solar available now | **{{ states('sensor.energy_optimizer_solar_potential') if has_value('sensor.energy_optimizer_solar_potential') else 'unavailable' }} kW** |
              | Forecast confidence | **{{ (p.get('confidence') * 100) | round(0) if p.get('confidence') is number else '—' }}%** |
              | Expected export revenue | **${{ p.get('expected_revenue') | round(2) if p.get('expected_revenue') is number else '—' }}** |
              | Expected import cost | **${{ p.get('expected_cost') | round(2) if p.get('expected_cost') is number else '—' }}** |
            grid_options:
              columns: 12
              rows: 5
          - type: history-graph
            title: Live power · last 3 hours
            hours_to_show: 3
            entities:
              - entity: sensor.saj_pv_power
                name: Solar
              - entity: sensor.saj_home_load
                name: House
              - entity: sensor.saj_battery_power
                name: Battery
              - entity: sensor.saj_meter_a_real_power_total
                name: Grid
            grid_options:
              columns: 12
              rows: 6

      - type: grid
        cards:
          - type: heading
            heading: Controls
            icon: mdi:tune-variant
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_select.energy_optimizer_mode
                name: Optimizer mode
              - entity: input_boolean.energy_optimizer_manual_override
                name: Manual override
              - entity: input_boolean.energy_optimizer_battery_control
                name: Battery automation
              - entity: input_boolean.energy_optimizer_hot_water_control
                name: Hot water automation
              - entity: input_boolean.energy_optimizer_ev_auto
                name: Car automation
              - entity: input_boolean.energy_optimizer_ev_allow_grid
                name: Charge car from grid
            grid_options:
              columns: 12
              rows: 6
          - type: tile
            entity: binary_sensor.energy_optimizer_actuation_ready
            name: System ready
            icon: mdi:shield-check-outline
          - type: tile
            entity: binary_sensor.tesla_wall_connector_vehicle_connected
            name: Car connected
            icon: mdi:ev-plug-type2
          - type: tile
            entity: binary_sensor.hot_water_heating_active
            name: Water heating
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.energy_optimizer_readiness
            name: Readiness detail
            icon: mdi:information-outline
