# Node-RED is the sole owner of SAJ anti-reflux/export-limit registers. Keep the
# former Home Assistant automation ID as a disabled, inert update target so a
# deployment can retire it without deleting rollback history. This file must
# never contain a numeric service call or other inverter/device write.
- id: energy_optimizer_saj_curtailment_governor
  alias: Energy Optimizer - RETIRED HA SAJ Curtailment Writer
  description: >-
    Retired. Guarded Node-RED schema-v2 actuation exclusively owns negative-FIT
    anti-reflux and raw export-limit writes.
  initial_state: false
  triggers:
    - trigger: event
      event_type: energy_optimizer_retired_ha_curtailment_writer
  conditions:
    - condition: template
      value_template: "{{ false }}"
  actions: []
  mode: single
