[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-energy-manager"
version = "0.5.4"
description = "Home Assistant-independent SAJ, EV and hot-water energy controller"
requires-python = ">=3.11"
dependencies = [
  "aioesphomeapi>=45.10.2,<46",
  "aiohttp>=3.12,<4",
  "aiomqtt>=2.4,<3",
  "fastapi>=0.116,<1",
  "pvlib>=0.13,<1",
  "pymodbus>=3.11,<4",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[project.scripts]
energy-manager = "energy_manager.main:main"
energy-manager-dashboard = "energy_manager.dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["energy_manager*"]

[tool.setuptools.package-data]
energy_manager = ["web/*.html", "web/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
