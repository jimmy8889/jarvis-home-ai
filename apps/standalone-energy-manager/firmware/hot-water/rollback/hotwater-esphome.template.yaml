esphome:
  name: hotwater

esp8266:
  board: esp8285

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.2.237
    gateway: 10.0.2.1
    subnet: 255.255.255.0

api:

logger:

web_server:
  port: 80

ota:
  - platform: esphome

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Hot Water"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "Hot Water"
    pin: GPIO12
    id: relay
