[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-homelab-agent"
version = "0.1.0"
description = "Read-only Pilot host and NVIDIA telemetry agent"
requires-python = ">=3.11"

[project.scripts]
pilot-homelab-agent = "pilot_homelab_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pilot_homelab_agent*"]
