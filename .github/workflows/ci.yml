name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/pilot-core/pyproject.toml
            apps/room-agent/pyproject.toml
            apps/teslamate-adapter/pyproject.toml
      - name: Install services and checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/pilot-core -e apps/room-agent -e apps/teslamate-adapter ruff
      - name: Lint
        run: >-
          ruff check
          apps/pilot-core
          apps/room-agent
          apps/teslamate-adapter
          deploy/scripts/pilot-register-device
          deploy/scripts/pilot-command
          deploy/scripts/pilot-media
          deploy/scripts/pilot-audio
          deploy/scripts/pilot-speak
          deploy/scripts/pilot-media-room-acceptance
          deploy/scripts/pilot-bootstrap-device
          deploy/scripts/pilot-core-backup
          deploy/scripts/pilot-core-diagnose
          deploy/scripts/pilot-core-restore
          deploy/scripts/pilot-secrets
          infra/pilot-core/volume_archive.py
          infra/pilot-core/tests
      - name: Test room agent
        run: python -m unittest discover -s apps/room-agent/tests -v
      - name: Test Pilot Core
        run: python -m unittest discover -s apps/pilot-core/tests -v
      - name: Test TeslaMate adapter
        run: python -m unittest discover -s apps/teslamate-adapter/tests -p 'test_*.py' -v
      - name: Test TeslaMate 4.0.1 schema and read-only role
        env:
          PILOT_TESLAMATE_TEST_PYTHON: python
        run: apps/teslamate-adapter/tests/integration/run.sh
      - name: Test Pilot Core backup archive
        run: python -m unittest discover -s infra/pilot-core/tests -v
      - name: Test Raspberry Pi display node
        env:
          PYTHONPATH: apps/display-node
        run: python -m unittest discover -s apps/display-node/tests -v
      - name: Validate display JavaScript
        run: |
          node --check apps/display-node/pilot_display_node/static/app.js
          node --check apps/pilot-core/pilot_core/dashboard/app.js
      - name: Compile services
        run: >-
          python -m compileall -q
          apps/pilot-core/pilot_core
          apps/room-agent/pilot_room_agent
          apps/teslamate-adapter/teslamate_adapter
          apps/display-node/pilot_display_node
      - name: Validate product schema JSON
        run: |
          for schema in packages/event-schema/*.json; do
            python -m json.tool "$schema" >/dev/null
          done

  energy-optimizer:
    name: Energy optimiser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/energy-optimizer/pyproject.toml
            apps/energy-optimizer/uv.lock
      - name: Install optimiser and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'apps/energy-optimizer[test]' ruff pyyaml jinja2
      - name: Lint and test optimiser
        run: |
          # Keep CI focused on correctness errors; broad style normalization is
          # intentionally a separate change for this established codebase.
          ruff check --select E9,F63,F7,F82 apps/energy-optimizer
          python -m pytest apps/energy-optimizer/tests -q
      - name: Test and validate Node-RED actuator
        run: |
          node --test apps/energy-optimizer/node-red/guard.test.js
          python -m json.tool apps/energy-optimizer/node-red/energy-optimizer-flow.json >/dev/null
      - name: Validate Home Assistant exports
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('apps/energy-optimizer/home-assistant').glob('*.yaml')):
              list(yaml.safe_load_all(path.read_text()))
              print(path)
          PY
          ruby apps/energy-optimizer/home-assistant/validate-contract.rb
          python apps/energy-optimizer/home-assistant/validate-templates.py
      - name: Validate deployment and build image
        run: |
          bash -n deploy/scripts/energy-optimizer-sync
          bash -n deploy/scripts/energy-optimizer-rollback
          docker compose -f infra/energy-optimizer/docker-compose.yml config --quiet
          docker build -t pilot-energy-optimizer-ci apps/energy-optimizer

  standalone-energy-manager:
    name: Standalone energy manager
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/standalone-energy-manager/pyproject.toml
            apps/standalone-energy-manager/uv.lock
      - name: Install, test and compile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'apps/standalone-energy-manager[test]'
          python -m pytest apps/standalone-energy-manager/tests -q
          python -m compileall -q apps/standalone-energy-manager/energy_manager
      - name: Validate dashboard JavaScript
        run: |
          node - <<'JS'
          const fs = require('fs');
          const source = fs.readFileSync('apps/standalone-energy-manager/energy_manager/web/index.html', 'utf8');
          const match = source.match(/<script>([\s\S]*)<\/script>/);
          if (!match) throw new Error('dashboard script not found');
          new Function(match[1]);
          JS

  deployment:
    name: Deployment definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Ansible
        run: python -m pip install ansible-core
      - name: Check shell scripts
        run: |
          bash -n deploy/scripts/pilot-hardware-inventory
          bash -n deploy/scripts/pilot-activate
          bash -n deploy/scripts/pilot-core-deploy
          bash -n deploy/scripts/pilot-firmware-publish
          bash -n deploy/scripts/pilot-rollback
          bash -n deploy/scripts/pilot-validate
          bash -n deploy/scripts/energy-optimizer-sync
          bash -n deploy/scripts/energy-optimizer-rollback
          bash -n firmware/pilot-display-node/scripts/build.sh
          bash -n firmware/pilot-display-node/scripts/flash.sh
          bash -n firmware/pilot-display-node/scripts/package-release.sh
          bash -n apps/teslamate-adapter/tests/integration/run.sh
      - name: Check Python deployment scripts
        run: >-
          python -m py_compile
          deploy/scripts/pilot-register-device
          deploy/scripts/pilot-command
          deploy/scripts/pilot-media
          deploy/scripts/pilot-audio
          deploy/scripts/pilot-speak
          deploy/scripts/pilot-media-room-acceptance
          deploy/scripts/pilot-bootstrap-device
          deploy/scripts/pilot-core-backup
          deploy/scripts/pilot-core-diagnose
          deploy/scripts/pilot-core-restore
          deploy/scripts/pilot-secrets
          infra/pilot-core/volume_archive.py
      - name: Smoke-test production container and authenticated secrets
        run: |
          cleanup() {
            docker compose -f infra/docker-compose.yml down -v --remove-orphans || true
            sudo rm -rf infra/secrets
          }
          trap cleanup EXIT
          sudo deploy/scripts/pilot-secrets \
            --directory infra/secrets \
            --runtime-gid 10001 \
            init
          sudo deploy/scripts/pilot-secrets \
            --directory infra/secrets \
            --runtime-gid 10001 \
            check
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml build pilot-core
          docker compose -f infra/docker-compose.yml up -d --no-build pilot-core
          docker compose -f infra/docker-compose.yml exec -T pilot-core \
            python -c 'import websockets'
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8770/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose -f infra/docker-compose.yml logs pilot-core
              exit 1
            fi
            sleep 1
          done
          admin_token="$(sudo cat infra/secrets/pilot_core_admin_token)"
          curl --fail --silent \
            -H "Authorization: Bearer ${admin_token}" \
            http://127.0.0.1:8770/v1/integrations/diagnostics \
            >/dev/null
          unset admin_token
      - name: Check TeslaMate sidecar image and Compose definition
        run: |
          docker build -t pilot-teslamate-adapter-ci apps/teslamate-adapter
          docker compose -f infra/teslamate-adapter/docker-compose.pilot.yml config --quiet
      - name: Check playbook syntax
        run: >-
          ansible-playbook
          -i deploy/ansible/inventory/hosts.example.yml
          deploy/ansible/site.yml
          --syntax-check

  android-tv:
    name: Shield TV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shield-tv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/shield-tv/*.gradle.kts
            apps/shield-tv/gradle/wrapper/gradle-wrapper.properties
            apps/shield-tv/app/build.gradle.kts
      - name: Test, lint, and assemble Pilot TV
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

  android-wall:
    name: Android wall tablet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pilot-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/pilot-android/*.gradle.kts
            apps/pilot-android/gradle/wrapper/gradle-wrapper.properties
            apps/pilot-android/app/build.gradle.kts
      - name: Test, lint, and assemble Pilot Wall
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

  ios:
    name: Pilot iOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test shared Pilot client package
        run: xcrun swift test --package-path packages/PilotClientKit
      - name: Build and test Pilot for iPhone and iPad
        working-directory: apps/pilot-ios
        shell: bash
        run: |
          destination_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(item["udid"] for rows in data["devices"].values() for item in rows if item["name"].startswith("iPhone")))'
          )"
          # SendspinKit 1.0.1 is Swift 5 compatible, while Xcode 16.4's iOS
          # 18.5 SDK rejects its UIDevice metadata helper in Swift 6 mode.
          xcodebuild \
            -project Pilot.xcodeproj \
            -scheme Pilot \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -derivedDataPath "$RUNNER_TEMP/PilotDerivedData" \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            test
      - name: Build and test Pilot Drive for iPhone and iPad
        working-directory: apps/pilot-drive
        shell: bash
        run: |
          destination_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(item["udid"] for rows in data["devices"].values() for item in rows if item["name"].startswith("iPhone")))'
          )"
          ipad_destination_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(item["udid"] for rows in data["devices"].values() for item in rows if item["name"].startswith("iPad")))'
          )"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' PilotDrive/Info.plist >/dev/null 2>&1; then
            echo 'Pilot Drive must not contain an ATS exception' >&2
            exit 1
          fi
          xcodebuild \
            -project PilotDrive.xcodeproj \
            -scheme PilotDrive \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -derivedDataPath "$RUNNER_TEMP/PilotDriveDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
          xcodebuild \
            -project PilotDrive.xcodeproj \
            -scheme PilotDrive \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${ipad_destination_id}" \
            -derivedDataPath "$RUNNER_TEMP/PilotDriveIPadDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
