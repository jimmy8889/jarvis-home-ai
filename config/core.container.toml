[server]
listen_host = "0.0.0.0"
listen_port = 8770
database_path = "/data/pilot.db"
audio_asset_path = "/data/audio"
audio_asset_max_bytes = 20000000
audio_asset_retention_seconds = 3600
meeting_asset_path = "/data/meetings"
meeting_asset_max_bytes = 2000000000
public_upload_base_url = "https://pilot-upload.jameshomeautomation.work"
public_client_base_url = "https://pilot.jameshomeautomation.work"
firmware_asset_path = "/data/firmware"
firmware_asset_max_bytes = 8000000
vehicle_asset_path = "/data/vehicle-assets"
vehicle_asset_max_bytes = 10000000
voice_audio_max_bytes = 1600000
conversation_session_ttl_seconds = 900
conversation_max_turns = 20
admin_token_env = "PILOT_CORE_ADMIN_TOKEN"
bootstrap_token_env = "PILOT_CORE_BOOTSTRAP_TOKEN"
legacy_bootstrap_enabled = false

[integrations]
music_assistant_url = "http://10.0.2.72:8095"
music_assistant_token_env = "MUSIC_ASSISTANT_TOKEN"
home_assistant_url = "http://10.0.2.72:8123"
home_assistant_token_env = "HOME_ASSISTANT_TOKEN"
home_assistant_assist_pipeline_id = "01kxkqhhw28z558e2b99nwzk0z"
home_assistant_assist_language = "en"
home_assistant_assist_timeout_seconds = 60
weather_entity_id = "weather.geebung"
sun_entity_id = "sun.sun"
outdoor_temperature_entity_id = "sensor.gw1100c_outdoor_temperature"
indoor_temperature_entity_id = "sensor.temp3_temperature"
temperature_history_hours = 24
home_timezone = "Australia/Brisbane"
energy_solar_power_entity_id = "sensor.pv_power_mqtt_abs"
energy_grid_power_entity_id = "sensor.saj_ct_grid_power_total"
energy_battery_power_entity_id = "sensor.saj_battery_power_2"
energy_battery_soc_entity_id = "sensor.saj_battery_1_soc"
energy_home_load_entity_id = "sensor.saj_home_load"
energy_server_power_entity_id = "sensor.server_desk_power"
energy_vehicle_connected_entity_id = "binary_sensor.tesla_wall_connector_vehicle_connected"
energy_vehicle_power_entity_id = "sensor.tesla_charging_power"
energy_vehicle_soc_entity_id = "sensor.jarvis_battery"
energy_solar_today_entity_ids = ["sensor.saj_power_current_day", "sensor.saj_today_pv_energy_2", "sensor.saj_today_pv_energy_3"]
energy_home_today_entity_id = "sensor.saj_total_today_load"
energy_grid_export_today_entity_id = "sensor.saj_sum_all_phases_sell_today"
energy_history_hours = 24
amber_import_price_entity_id = "sensor.amber_01k9pncwz9prbf508wt588p9mn_amber_price_now"
amber_feed_in_price_entity_id = "sensor.amber_01k9pncwz9prbf508wt588p9mn_amber_fit_now"
amber_feed_in_forecast_entity_id = "sensor.amber_express_trader_sheena_street_feed_in_price"
tesla_charging_mode_entity_id = "input_select.tesla_charging_mode"
teslamate_adapter_url = "http://10.0.1.192:8781"
teslamate_adapter_token_env = "PILOT_TESLAMATE_ADAPTER_TOKEN"
media_room_mode_on_script_id = "script.movie_mode_on"
media_room_mode_off_script_id = "script.movie_mode_off"
temperature_office_entity_id = "sensor.office_broadlink_temperature"
temperature_tv_room_entity_id = "sensor.gw1100c_indoor_temperature"
temperature_bedroom_entity_id = "sensor.temp3_temperature"
temperature_media_room_entity_id = "sensor.media_room_broadlink_temperature"
proxmox_url = "https://10.0.1.120:8006"
proxmox_token_id = "pilot-monitor@pve!pilot-core"
proxmox_token_secret_env = "PROXMOX_TOKEN_SECRET"
proxmox_migration_token_id = "pilot-migrate@pve!pilot-core"
proxmox_migration_token_secret_env = "PROXMOX_MIGRATION_TOKEN_SECRET"
proxmox_verify_tls = false
truenas_url = "https://10.0.1.102"
truenas_token_env = "TRUENAS_API_KEY"
# TrueNAS currently presents its factory self-signed localhost certificate.
# Transport remains encrypted, but hostname/CA verification must stay disabled
# until a LAN-valid certificate is installed on the appliance.
truenas_verify_tls = false
homelab_cache_seconds = 5
tts_provider = "openai"
tts_url = "http://10.0.1.43:8030/v1/audio/speech"
tts_token_env = "PILOT_TTS_TOKEN"
# Optional Kokoro-82M sidecar on the RTX 3080. Kokoro voice IDs (bm_*/bf_*)
# are routed here while Qwen remains the default engine for its own voices.
tts_kokoro_url = "http://10.0.1.43:8032/v1/audio/speech"
tts_kokoro_token_env = "PILOT_KOKORO_TOKEN"
tts_engine_id = ""
tts_model = "tts"
tts_voice = "serena"
tts_format = "wav"
tts_language = "en_US"
tts_sample_rate = 16000
tts_sample_channels = 1
tts_sample_bytes = 2
tts_timeout_seconds = 30
voice_stt_url = "http://10.0.1.43:8031/v1"
voice_stt_token_env = "PILOT_VOICE_STT_TOKEN"
voice_stt_model = "small.en"
voice_stt_timeout_seconds = 20
llm_provider = "vllm"
llm_url = "http://10.0.1.20:8000/v1"
llm_token_env = "PILOT_LLM_TOKEN"
llm_model = "auto"
llm_reasoning_effort = ""
llm_timeout_seconds = 60
llm_max_output_tokens = 1024
llm_max_tool_rounds = 4
llm_context_turns = 12
meeting_stt_url = ""
meeting_stt_token_env = "PILOT_MEETING_STT_TOKEN"
meeting_stt_model = "whisper-1"
meeting_stt_timeout_seconds = 600
meeting_analysis_model = "auto"
meeting_transcript_max_characters = 500000

[[integrations.llm_backends]]
id = "ai3090-primary"
url = "http://10.0.1.20:8000/v1"
token_env = "PILOT_LLM_3090_TOKEN"
model = "primary"
roles = ["assistant", "reasoning", "meeting"]
priority = 10
max_output_tokens = 1536
timeout_seconds = 90

# The RTX 3080 exposes one GPU mode at a time. When verifier mode is active it
# is a bounded assistant fallback; in speech mode this route is simply offline.
[[integrations.llm_backends]]
id = "ai3080-verifier"
url = "http://10.0.1.43:8000/v1"
token_env = "PILOT_LLM_3080_TOKEN"
model = "verifier"
roles = ["assistant", "verification"]
priority = 100
max_output_tokens = 1024
timeout_seconds = 60

[[integrations.llm_backends]]
id = "ai3080-vision"
url = "http://10.0.1.43:8000/v1"
token_env = "PILOT_LLM_3080_TOKEN"
model = "vision"
roles = ["vision"]
priority = 10
max_output_tokens = 1024
timeout_seconds = 60

