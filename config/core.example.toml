[server]
listen_host = "127.0.0.1"
listen_port = 8770
database_path = "/var/lib/pilot-core/pilot.db"
audio_asset_path = "/var/lib/pilot-core/audio"
audio_asset_max_bytes = 20000000
audio_asset_retention_seconds = 3600
meeting_asset_path = "/var/lib/pilot-core/meetings"
meeting_asset_max_bytes = 2000000000
public_upload_base_url = "https://pilot-upload.example.com"
firmware_asset_path = "/var/lib/pilot-core/firmware"
firmware_asset_max_bytes = 8000000
vehicle_asset_path = "/var/lib/pilot-core/vehicle-assets"
vehicle_asset_max_bytes = 10000000
voice_audio_max_bytes = 1600000
admin_token_env = "PILOT_CORE_ADMIN_TOKEN"
bootstrap_token_env = "PILOT_CORE_BOOTSTRAP_TOKEN"
legacy_bootstrap_enabled = false

[integrations]
energy_manager_url = "http://10.0.1.205:8787"
energy_manager_timeout_seconds = 2
energy_manager_snapshot_interval_seconds = 2
energy_manager_plan_interval_seconds = 20
energy_manager_stale_after_seconds = 10
music_assistant_url = "http://10.0.2.72:8095"
music_assistant_token_env = "MUSIC_ASSISTANT_TOKEN"
home_assistant_url = "http://10.0.2.72:8123"
home_assistant_token_env = "HOME_ASSISTANT_TOKEN"
# Select a pipeline that includes local STT. The deployed Home Assistant
# identifier belongs here; leaving this blank uses HA's preferred pipeline.
home_assistant_assist_pipeline_id = ""
home_assistant_assist_language = "en"
home_assistant_assist_timeout_seconds = 60
# Set this to the Home Assistant weather entity used by room displays.
weather_entity_id = ""
# Optional source for exact day/night artwork. Home Assistant normally uses sun.sun.
sun_entity_id = ""
# Optional rolling temperature pages for embedded room displays.
outdoor_temperature_entity_id = ""
indoor_temperature_entity_id = ""
temperature_history_hours = 24
home_timezone = "Australia/Brisbane"
vehicle_home_geofence_entity_id = "sensor.tesla_geofence"
# Optional bounded energy summary for authenticated display devices.
energy_solar_power_entity_id = ""
energy_grid_power_entity_id = ""
energy_battery_power_entity_id = ""
energy_battery_soc_entity_id = ""
energy_home_load_entity_id = ""
# Optional dashboard-only projections. Pilot never exposes unrelated HA state.
energy_server_power_entity_id = ""
energy_vehicle_connected_entity_id = ""
energy_vehicle_power_entity_id = ""
energy_vehicle_soc_entity_id = ""
energy_solar_today_entity_ids = []
energy_home_today_entity_id = ""
energy_grid_export_today_entity_id = ""
energy_history_hours = 24
amber_import_price_entity_id = ""
amber_feed_in_price_entity_id = ""
amber_feed_in_forecast_entity_id = ""
office_sim_rig_switch_entity_id = ""
# Read-only Pilot adapter beside TeslaMate. The token is supplied separately.
teslamate_adapter_url = "http://10.0.1.192:8781"
teslamate_adapter_token_env = "PILOT_TESLAMATE_ADAPTER_TOKEN"
media_room_mode_on_script_id = ""
media_room_mode_off_script_id = ""
temperature_office_entity_id = ""
temperature_tv_room_entity_id = ""
temperature_bedroom_entity_id = ""
temperature_media_room_entity_id = ""
# Read-only infrastructure monitoring. Use a PVEAuditor token and a TrueNAS
# API key assigned only the reporting/pool/disk read roles.
proxmox_url = ""
proxmox_token_id = ""
proxmox_token_secret_env = "PROXMOX_TOKEN_SECRET"
proxmox_migration_token_id = ""
proxmox_migration_token_secret_env = "PROXMOX_MIGRATION_TOKEN_SECRET"
proxmox_verify_tls = true
truenas_url = ""
truenas_token_env = "TRUENAS_API_KEY"
truenas_verify_tls = true
homelab_cache_seconds = 5
# Local TTS stays disabled until the provider and engine are confirmed.
tts_provider = ""
# To reuse the Home Assistant Piper integration:
# tts_provider = "home_assistant"
# tts_engine_id = "tts.piper"
# For a local OpenAI-compatible speech server:
# tts_provider = "openai"
# tts_url = "http://127.0.0.1:8000/v1/audio/speech"
tts_token_env = "PILOT_TTS_TOKEN"
# Optional Kokoro-82M sidecar. Kokoro-prefixed voices are routed here.
# tts_kokoro_url = "http://127.0.0.1:8032/v1/audio/speech"
# tts_kokoro_token_env = "PILOT_KOKORO_TOKEN"
tts_model = "tts-1"
tts_voice = "default"
tts_format = "wav"
tts_language = "en"
tts_sample_rate = 16000
tts_sample_channels = 1
tts_sample_bytes = 2
tts_timeout_seconds = 60
voice_stt_url = "http://127.0.0.1:8031/v1"
voice_stt_token_env = "PILOT_VOICE_STT_TOKEN"
voice_stt_model = "small.en"
voice_stt_timeout_seconds = 20
# Optional local vLLM/OpenAI-compatible reasoning provider.
llm_provider = ""
llm_url = ""
llm_token_env = "PILOT_LLM_TOKEN"
# Use the served model ID, or "auto" for a single-model vLLM endpoint.
llm_model = ""
llm_reasoning_effort = ""
llm_timeout_seconds = 60
llm_max_output_tokens = 1024
llm_max_tool_rounds = 4
llm_context_turns = 12
llm_fast_context_tokens = 8192
llm_standard_context_tokens = 16384
llm_deep_context_tokens = 65536
llm_hermes_context_tokens = 65536
llm_experimental_context_tokens = 131072
llm_fast_output_tokens = 512
llm_standard_output_tokens = 1024
llm_deep_output_tokens = 2048
llm_hermes_output_tokens = 4096
meeting_stt_url = "http://whisper.internal:8000/v1"
meeting_stt_token_env = "PILOT_MEETING_STT_TOKEN"
meeting_stt_model = "whisper-1"
meeting_stt_timeout_seconds = 600
# Optional stronger vLLM model used only after transcription.
meeting_analysis_model = ""
meeting_transcript_max_characters = 500000

# Optional multi-GPU/model pool. When present, these routes replace the single
# llm_url/llm_model route above. Lower priority values are tried first.
# [[integrations.llm_backends]]
# id = "ai3090-primary"
# url = "http://ai3090:8000/v1"
# token_env = "PILOT_LLM_3090_TOKEN"
# model = "primary"
# roles = ["assistant", "reasoning", "meeting"]
# priority = 10
# max_output_tokens = 1536
# timeout_seconds = 90
#
# [[integrations.llm_backends]]
# id = "ai3080-verifier"
# url = "http://ai3080:8000/v1"
# token_env = "PILOT_LLM_3080_TOKEN"
# model = "verifier"
# roles = ["assistant", "verification"]
# priority = 100
# max_output_tokens = 1024
# timeout_seconds = 60

# Provider IDs remain internal. Apps use only this stable Pilot vehicle ID.
[[vehicles]]
id = "jarvis"
name = "Jarvis"
teslamate_car_id = 1
default_climate_target_c = 22.0

[vehicles.telemetry]
battery_percent = "sensor.jarvis_battery_level"
online = "binary_sensor.jarvis_status"
state = "binary_sensor.jarvis_status"
odometer_km = "sensor.jarvis_odometer_2"
rated_range_km = "sensor.jarvis_battery_range"
inside_temperature_c = "sensor.jarvis_inside_temperature"
outside_temperature_c = "sensor.jarvis_outside_temperature"
locked = "lock.jarvis_lock"
charging_state = "sensor.jarvis_charging"
charge_port = "cover.jarvis_charge_port_door"
charge_limit_percent = "number.jarvis_charge_limit_2"
charge_rate_kw = "sensor.jarvis_charger_power_2"
time_to_full_hours = "sensor.jarvis_time_to_full_charge"
energy_added_kwh = "sensor.jarvis_charge_energy_added"
navigation_destination = "sensor.jarvis_destination"
distance_to_destination_km = "sensor.jarvis_distance_to_arrival_2"
time_to_destination_hours = "sensor.jarvis_time_to_arrival"
state_of_charge_at_arrival_percent = "sensor.jarvis_state_of_charge_at_arrival"
latitude = "device_tracker.jarvis_location"
longitude = "device_tracker.jarvis_location"
location_name = "device_tracker.jarvis_location"
tyre_front_left_bar = "sensor.jarvis_tire_pressure_front_left"
tyre_front_right_bar = "sensor.jarvis_tire_pressure_front_right"
tyre_rear_left_bar = "sensor.jarvis_tire_pressure_rear_left"
tyre_rear_right_bar = "sensor.jarvis_tire_pressure_rear_right"

[vehicles.controls.wake]
domain = "button"
service = "press"
entity_id = "button.jarvis_wake_up"

[vehicles.controls.wake.home]
domain = "button"
service = "press"
entity_id = "button.tesla_ble_039d9c_wake_up"

[vehicles.controls.lock]
domain = "lock"
service = "lock"
entity_id = "lock.jarvis_lock"
observable_entity_id = "lock.jarvis_lock"

[vehicles.controls.lock.home]
domain = "lock"
service = "lock"
entity_id = "lock.tesla_ble_lock_car"

[vehicles.controls.unlock]
domain = "lock"
service = "unlock"
entity_id = "lock.jarvis_lock"
observable_entity_id = "lock.jarvis_lock"

[vehicles.controls.unlock.home]
domain = "lock"
service = "unlock"
entity_id = "lock.tesla_ble_lock_car"

[vehicles.controls.send_route]
domain = "pilot_vehicle"
service = "send_navigation"
# Native HA Tesla Fleet device ID (internal configuration only).
device_id = "native-tesla-device-id"

[[rooms]]
id = "bedroom"
name = "Bedroom"
music_enabled = false
response_player_id = "bedroom-display-speaker"
default_music_player_id = ""
default_device_id = "pilot-bedroom-display"
agent_url = ""

[[players]]
id = "bedroom-display-speaker"
room_id = "bedroom"
name = "Bedroom Display Speaker"
protocol = "pilot-device"
kind = "response"
endpoint = "pilot-bedroom-display"
control_enabled = false

[[rooms]]
id = "office"
name = "Office"
home_area_ids = ["office"]
response_player_id = "office-assistant"
default_music_player_id = "office-music"
default_device_id = "pilot-office"
assist_satellite_entity_id = "assist_satellite.pilot_office_assist_satellite_2"
# The room agent remains loopback-only. Pilot Core reaches it through the
# device's authenticated outbound command WebSocket, not this legacy field.
agent_url = ""

[[players]]
id = "office-assistant"
room_id = "office"
name = "Office Assistant"
protocol = "pipewire"
kind = "response"
endpoint = "homeai"

[[players]]
id = "office-music"
room_id = "office"
name = "Pilot Office Music"
protocol = "sendspin"
kind = "music"
endpoint = "ws://10.0.2.72:8927/sendspin"
external_id = "uppilotoffice"

[[players]]
id = "office-airplay"
room_id = "office"
name = "Pilot Office"
protocol = "airplay"
kind = "music-input"
endpoint = "homeai.local:5000"

[[rooms]]
id = "media-room"
name = "Media Room"
home_area_ids = ["media_room"]
response_player_id = "media-room-assistant"
default_music_player_id = "media-room-heos"
default_device_id = ""
agent_url = ""

[[players]]
id = "media-room-assistant"
room_id = "media-room"
name = "Media Room Assistant"
protocol = "heos"
kind = "response"
endpoint = "media_player.media_room"
external_id = "1174905188"
# Discovery and state are enabled; mutations stay locked until accepted.
control_enabled = false

[[players]]
id = "media-room-heos"
room_id = "media-room"
name = "Media Room"
protocol = "heos"
kind = "music"
endpoint = "media_player.media_room"
control_endpoint = "media_player.media_room_3"
external_id = "1174905188"
control_enabled = false

[[players]]
id = "media-room-shield"
room_id = "media-room"
name = "SHIELD"
protocol = "universal_player"
kind = "video"
external_id = "upb0713734fca0742d2bf2125b59cbf3b1"
control_enabled = false
