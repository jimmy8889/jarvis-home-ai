name: Pilot
options:
  bundleIdPrefix: com.jameshazell
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PilotClientKit:
    path: ../../packages/PilotClientKit
  SendspinKit:
    url: https://github.com/Sendspin/SendspinKit.git
    from: 1.0.1
targets:
  Pilot:
    type: application
    platform: iOS
    sources:
      - Pilot
    info:
      path: Pilot/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Pilot connects to your local Pilot Core server and room audio devices.
        NSCameraUsageDescription: Pilot uses the camera only when you choose to scan a single-use Pilot Core pairing code.
        NSMicrophoneUsageDescription: Pilot uses the microphone when you talk to your private local voice assistant or explicitly record a meeting.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jameshazell.pilot
        PRODUCT_NAME: Pilot
        DEVELOPMENT_TEAM: 362V48U65C
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: PilotClientKit
      - package: SendspinKit
      - target: PilotWatch
        embed: true
    scheme:
      testTargets:
        - PilotTests
  PilotWatch:
    type: application
    platform: watchOS
    sources:
      - PilotWatch
    info:
      path: PilotWatch/Info.plist
      properties:
        CFBundleDisplayName: Pilot Meetings
        NSMicrophoneUsageDescription: Pilot records a meeting only after you explicitly tap Start, then securely relays it to your private Pilot Core.
        UIBackgroundModes:
          - audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jameshazell.pilot
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jameshazell.pilot.watchkitapp
        PRODUCT_NAME: PilotWatch
        DEVELOPMENT_TEAM: 362V48U65C
        TARGETED_DEVICE_FAMILY: "4"
        ONLY_ACTIVE_ARCH: NO
        "ARCHS[sdk=watchos*]": "arm64_32 arm64"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PilotWatchTests
  PilotWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - PilotWatchTests
    dependencies:
      - target: PilotWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 362V48U65C
  PilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PilotTests
    dependencies:
      - target: Pilot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
