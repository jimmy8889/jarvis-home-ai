services:
  ben-energy-optimizer:
    build:
      context: ../../apps/ben-energy-optimizer
    container_name: ben-energy-optimizer
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10004:10004"
    environment:
      TZ: Australia/Brisbane
      BEN_ENERGY_OPTIMIZER_HA_URL: http://127.0.0.1:8123
    secrets:
      - home_assistant_token
    volumes:
      - /home/energytrader/homeassistant/ben-energy-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8786/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  home_assistant_token:
    file: /home/energytrader/homeassistant/secrets/ben-energy-optimizer-ha-token
