name: PilotDrive
options:
  bundleIdPrefix: com.jameshazell
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  PilotClientKit:
    path: ../../packages/PilotClientKit
targets:
  PilotDrive:
    type: application
    platform: iOS
    sources:
      - PilotDrive
    info:
      path: PilotDrive/Info.plist
      properties:
        CFBundleDisplayName: Pilot Drive
        NSFaceIDUsageDescription: Pilot Drive uses Face ID to confirm sensitive vehicle commands.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jameshazell.pilotdrive
        PRODUCT_NAME: PilotDrive
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        DEVELOPMENT_TEAM: 362V48U65C
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: PilotClientKit
    scheme:
      testTargets:
        - PilotDriveTests
        - PilotDriveUITests
  PilotDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PilotDriveTests
    dependencies:
      - target: PilotDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PilotDriveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PilotDriveUITests
    dependencies:
      - target: PilotDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
