[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot-teslamate-adapter"
version = "0.1.0"
description = "Bounded read-only TeslaMate 4.0.1 adapter for Pilot Core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.35,<1",
]

[project.scripts]
pilot-teslamate-adapter = "teslamate_adapter.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["teslamate_adapter*"]
